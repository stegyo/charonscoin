<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- MindAR Library -->
  <script src="./libs/mindar/mindar-image-three.prod.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      height: 100%; width: 100%;
      font-family: Arial, sans-serif;
    }

    .mindar-container {
      width: 100vw; height: 100vh;
      position: absolute; top: 0; left: 0;
      display: block;
    }

    #ar-ui { width: 100%; height: 100%; }

    #ui-buttons {
      position: absolute; top: 40%; left: 50%;
      transform: translateX(-50%);
      z-index: 10; pointer-events: auto;
      border: solid 1px;
      border-radius: 10px;
      background: lightblue;
      padding: 10px 30px;
    }

    #ui-buttons button {
      padding: 15px 30px; font-size: 18px; margin: 10px;
      background: #33691e; color: white;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .questionsDiv{
      display: none;
      position: relative;
      top: 20px;
      left: 50%;
      transform: translate(-50%);
      background: lightblue;
      padding: 10px 20px;
      border-radius: 10px;
      border: solid 1px blue;
      max-width: 80%;
      z-index: 50;
    }
    .questBTN{
        margin: 4px;
        background-color: #aac3e3;
        font-size: 16px;
        padding: 8px;
        border-radius: 10px;
    }
    #buttonsContainer{
  </style>
</head>

<body>

  <div id="ui-buttons">
    <button id="start-ar-engine-button">Start AR</button>
    <button id="return-button">Return</button>
  </div>
  
  <div class='questionsDiv' id="questionsDiv0" style='text-align: center;'>
    <p>
      Hey you! Could you please help a poor skeleton out?<br/> 
    </p>
    <button class='questBTN' id="yesBTN" onclick="window.location.href='question1.html';">Help him</button>  &nbsp;&nbsp;&nbsp;&nbsp; <button class='questBTN'  id="cancelBTN" onclick="hideDiv('questionsDiv0')">Cancel</button> 
  </div>
  <div class='questionsDiv' id="questionsDiv1" style='text-align: center;'>
    <p>
      22222222222222222222222<br/> 
    </p>
    <button class='questBTN' id="yesBTN" onclick="window.location.href='question2.html';">Help him</button>  &nbsp;&nbsp;&nbsp;&nbsp; <button class='questBTN'  id="cancelBTN" onclick="hideDiv('questionsDiv1')">Cancel</button> 
  </div>
  <div class='questionsDiv' id="questionsDiv2" style='text-align: center;'>
    <p>
      33333333333333333333333333<br/> 
    </p>
    <button class='questBTN' id="yesBTN" onclick="window.location.href='question3.html';">Help him</button>  &nbsp;&nbsp;&nbsp;&nbsp; <button class='questBTN'  id="cancelBTN" onclick="hideDiv('questionsDiv2')">Cancel</button> 
  </div>
  
  <div id="ar-ui" class="mindar-container"></div>

  <script type="module">
    import { loadGLTF, loadAudio } from "./libs/loader.js";
    const THREE = window.MINDAR.IMAGE.THREE;

    let mindarThree = null;
    let isStarted = false;

    const startAREngineButton = document.getElementById("start-ar-engine-button");
    const returnButton = document.getElementById("return-button");
    const arUI = document.getElementById("ar-ui");

    // --- FIX: get 'from' from query string ---
    const params = new URLSearchParams(window.location.search);
    const from = params.get('from') || 'lore'; // fallback to 'lore' if not set

    // Return to the previous page
    const goBackToRolePage = () => {
      window.location.href = `index.html?section=${from}`;
    };
    returnButton.addEventListener("click", goBackToRolePage);

    // Function to create the AR experience (gltf model, mp3 sound)
    const createExperience = async (modelPath, anchorIndex, listener, audioPath, scaleVector) => {
      const model = await loadGLTF(modelPath);
      model.scene.scale.copy(scaleVector);
      model.scene.position.set(0, 0, 0);

      const anchor = mindarThree.addAnchor(anchorIndex);
      anchor.group.add(model.scene);

      const audioBuffer = await loadAudio(audioPath);

      const audio = new THREE.PositionalAudio(listener);
      audio.setBuffer(audioBuffer);
      audio.setRefDistance(100);
      audio.setLoop(true);
      audio.setVolume(0.5); // volume 0-1

      anchor.group.add(audio);

      anchor.onTargetFound = () => {
        audio.play();
        alert(anchor.targetIndex);
        showDiv('questionsDiv'+anchor.targetIndex);
      }
      anchor.onTargetLost = () => audio.pause();

      return anchor;
    };

    const start = async () => {
      hideDiv('ui-buttons');
      if (isStarted) return;
      isStarted = true;

      mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: arUI,
        imageTargetSrc: './assets/targets/markers1.mind' // Βεβαιώσου ότι περιέχει 3 στόχους
      });

      const { renderer, scene, camera } = mindarThree;

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      const listener = new THREE.AudioListener();
      camera.add(listener);

      // Create 3 AR experiences
      await createExperience(
        './assets/models/female_skeleton/scene.gltf', 
        0, 
        listener, 
        './assets/sounds/sound1.mp3', 
        new THREE.Vector3(0.03, 0.03, 0.03) 
      );

      await createExperience(
        './assets/models/kylix_greek/scene.gltf', 
        1, 
        listener, 
        './assets/sounds/sound2.mp3', 
        new THREE.Vector3(0.01, 0.01, 0.01) 
      );

      await createExperience(
        './assets/models/diana_the_huntress/scene.gltf', 
        2, 
        listener, 
        './assets/sounds/sound3.mp3', 
        new THREE.Vector3(0.1, 0.1, 0.1)
      );

      await mindarThree.start();

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });

      startAREngineButton.disabled = true;
    };

    startAREngineButton.addEventListener("click", start);
  </script>
  <script>
    function showDiv(id) {
      /*
      hideDiv('questionsDiv0');
      hideDiv('questionsDiv1');
      hideDiv('questionsDiv2');
      */
      var questionDivs = document.getElementsByClassName('questionsDiv');
      for (var i = 0; i < questionDivs.length; i ++) {
          questionDivs[i].style.display = 'none';
      }
      
      document.getElementById(id).style.display = "block";
    }
    
    function hideDiv(id) {
      document.getElementById(id).style.display = "none";
    }


  </script>

</body>
</html>
